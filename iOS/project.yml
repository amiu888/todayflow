# TodayFlow for iPhone (docs/ios/DESIGN.md). Generate the Xcode project with
#   iOS/generate.sh
# The .xcodeproj is not committed. The signing team comes from iOS/signing.env
# (ignored; see signing.env.example), so no account details live in git.
name: TodayFlowPhone
options:
  bundleIdPrefix: com.todayflow
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "8"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TodayFlow:
    path: ..
targets:
  TodayFlowPhoneApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: TodayFlowPhoneApp
    dependencies:
      - package: TodayFlow
        product: TodayFlowPhone
      - target: TodayFlowShare
        embed: true
    entitlements:
      path: TodayFlowPhoneApp/TodayFlowPhoneApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todayflow.ios
    info:
      path: TodayFlowPhoneApp/Info.plist
      properties:
        CFBundleDisplayName: TodayFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Pre-filled sync address: the TODAYFLOW_DEFAULT_SERVER build setting, written
        # by generate.sh into Local.xcconfig (ignored) from signing.env.
        TodayFlowDefaultServer: $(TODAYFLOW_DEFAULT_SERVER)
        CFBundleURLTypes:
          - CFBundleURLName: com.todayflow.ios
            CFBundleURLSchemes: [todayflow]
        NSLocalNetworkUsageDescription: TodayFlow syncs with your TodayFlow server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todayflow.ios
        PRODUCT_NAME: TodayFlow
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  TodayFlowShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: TodayFlow
        product: TodayFlowCore
    entitlements:
      path: ShareExtension/TodayFlowShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.todayflow.ios
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TodayFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 2
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todayflow.ios.share
        PRODUCT_NAME: TodayFlowShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  TodayFlowPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TodayFlowPhoneApp
      - package: TodayFlow
        product: TodayFlowPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todayflow.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TodayFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TodayFlow
        BUNDLE_LOADER: $(TEST_HOST)
  TodayFlowPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TodayFlowPhoneApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todayflow.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TodayFlowPhoneApp
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  TodayFlowPhone:
    build:
      targets:
        TodayFlowPhoneApp: all
    test:
      config: Debug
      targets:
        - TodayFlowPhoneTests
        - TodayFlowPhoneUITests
    run:
      config: Debug
    archive:
      config: Release
